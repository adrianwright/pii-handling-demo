<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <title>PII Safety Chat</title>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--cp-bg);
        color: var(--cp-text);
        font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      button, textarea { font: inherit; }
      button { color: inherit; }
      .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      header {
        background: var(--cp-bg-elevated);
        border-bottom: 1px solid var(--cp-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 24px;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 0.625rem;
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        display: grid;
        place-items: center;
        font-weight: 750;
      }
      h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
      .subtitle { color: var(--cp-text-muted); font-size: 13px; margin-top: 2px; }
      .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--cp-text-muted); }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cp-warning); }
      .status.connected .status-dot { background: var(--cp-success); }
      main {
        min-height: 0;
        height: calc(100vh - 73px);
      }
      .eyebrow {
        color: var(--cp-text-muted);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 8px 10px;
      }
      .workspace { min-width: 0; height: 100%; display: grid; grid-template-rows: 1fr auto; }
      .chat { overflow: auto; padding: 24px; }
      .empty { max-width: 720px; margin: 8vh auto 0; }
      .empty h3 { font-size: 28px; margin: 0 0 10px; letter-spacing: -0.03em; }
      .empty > p { color: var(--cp-text-muted); line-height: 1.55; margin: 0 0 24px; }
      .quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .quick {
        border: 1px solid var(--cp-border);
        background: var(--cp-surface);
        border-radius: 16px;
        padding: 16px;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
      }
      .quick:hover { border-color: var(--cp-accent); }
      .quick strong { display: block; margin-bottom: 6px; font-size: 14px; }
      .quick span { color: var(--cp-text-muted); font-size: 12px; line-height: 1.4; }
      .messages { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; }
      .message { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 0.625rem;
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-border);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 750;
      }
      .message.assistant .avatar { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
      .bubble {
        background: var(--cp-surface);
        border: 1px solid var(--cp-border);
        border-radius: 0.625rem;
        padding: 13px 15px;
        line-height: 1.55;
        white-space: pre-wrap;
      }
      .message-meta { color: var(--cp-text-muted); font-size: 11px; margin-top: 7px; display: flex; align-items: center; gap: 8px; }
      .safety-chip {
        border: 1px solid var(--cp-border-strong);
        border-radius: 999px;
        color: var(--cp-text-muted);
        font-size: 10px;
        font-weight: 750;
        padding: 2px 7px;
      }
      .safety-chip.redacted { border-color: var(--cp-warning); color: var(--cp-text); background: color-mix(in srgb, var(--cp-warning) 13%, transparent); }
      .control-trace {
        border-left: 3px solid var(--cp-warning);
        margin-top: 10px;
        padding: 2px 0 2px 12px;
      }
      .control-trace-label { color: var(--cp-text-muted); font-size: 10px; font-weight: 750; text-transform: uppercase; }
      .control-trace-text { font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.5; margin-top: 5px; white-space: pre-wrap; }
      .composer-wrap { border-top: 1px solid var(--cp-border); background: var(--cp-panel-strong); padding: 16px 24px 20px; }
      .privacy-note { max-width: 820px; margin: 0 auto 9px; color: var(--cp-text-muted); font-size: 11px; display: flex; gap: 6px; }
      .composer {
        max-width: 820px;
        margin: 0 auto;
        background: var(--cp-surface);
        border: 1px solid var(--cp-border-strong);
        border-radius: 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 10px;
        box-shadow: 0 0 2px var(--cp-border), 0 1px 2px var(--cp-border);
      }
      textarea {
        resize: none;
        border: 0;
        outline: 0;
        background: var(--cp-surface);
        color: var(--cp-text);
        min-height: 48px;
        max-height: 140px;
        padding: 10px;
      }
      textarea::placeholder { color: var(--cp-text-muted); }
      .send {
        align-self: end;
        border: 0;
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        border-radius: 0.625rem;
        min-width: 44px;
        height: 44px;
        padding: 0 14px;
        cursor: pointer;
        font-weight: 700;
      }
      .send:hover { background: var(--cp-accent-hover); }
      .send:disabled { background: var(--cp-border-strong); cursor: not-allowed; }
      .error { color: var(--cp-danger); }
      @media (max-width: 820px) {
        main { height: auto; }
        .workspace { min-height: calc(100vh - 73px); }
        .quick-grid { grid-template-columns: 1fr; }
        header, .chat, .composer-wrap { padding-left: 16px; padding-right: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <div class="brand-mark">A</div>
          <div>
            <h1>PII Safety Chat</h1>
            <div class="subtitle">Privacy-aware guidance for student support teams</div>
          </div>
        </div>
        <div class="status" id="serviceStatus">
          <span class="status-dot"></span>
          <span>Checking APIM connection</span>
        </div>
      </header>
      <main>
        <section class="workspace">
          <div class="chat" id="chat"></div>
          <div class="composer-wrap">
            <div class="privacy-note">Protected route: browser → local server → APIM → managed-identity model access</div>
            <form class="composer" id="composer">
              <textarea id="prompt" rows="1" maxlength="4000" placeholder="Ask the student advisor assistant"></textarea>
              <button class="send" id="send" type="submit">Send</button>
            </form>
          </div>
        </section>
      </main>
    </div>
    <script>
      let messages = [];
      let busy = false;

      const chat = document.querySelector("#chat");
      const composer = document.querySelector("#composer");
      const prompt = document.querySelector("#prompt");
      const send = document.querySelector("#send");
      const serviceStatus = document.querySelector("#serviceStatus");

      function escapeHtml(value) {
        const element = document.createElement("div");
        element.textContent = value;
        return element.innerHTML;
      }

      function renderChat() {
        if (!messages.length) {
          chat.innerHTML = `
            <div class="empty">
              <div class="eyebrow">Advisor copilot</div>
              <h3>How can I help?</h3>
              <p>Ask for privacy-minimized guidance, prepare next steps, or identify the right campus office without exposing student identity fields.</p>
              <div class="quick-grid">
                <button class="quick" data-prompt="Summarize this student support request and recommend the next action."><strong>Summarize a request</strong><span>Get a concise status and next action</span></button>
                <button class="quick" data-prompt="Help me identify the right campus office for this student request."><strong>Route a request</strong><span>Confirm ownership and advisor follow-up</span></button>
                <button class="quick" data-prompt="Draft a short privacy-safe update for a student."><strong>Draft an update</strong><span>Student-ready language with no private fields</span></button>
                <button class="quick" data-prompt="Create a checklist for resolving a student support request."><strong>Prepare a checklist</strong><span>Operational completion checks</span></button>
              </div>
            </div>
          `;
          return;
        }

        chat.innerHTML = `<div class="messages">${messages.map((message) => `
          <div class="message ${message.role}">
            <div class="avatar">${message.role === "assistant" ? "AI" : "You"}</div>
            <div>
              <div class="bubble ${message.error ? "error" : ""}">${escapeHtml(message.content)}</div>
              <div class="message-meta">
                <span>${message.role === "assistant" ? "Advisor assistant · Privacy-minimized" : "Advisor"}</span>
                ${message.safety ? `<span class="safety-chip ${message.safety.status === "REDACTED" ? "redacted" : ""}">${escapeHtml(message.safety.status)}</span>` : ""}
              </div>
              ${message.safety?.status === "REDACTED" && message.safety.redactedInput ? `
                <div class="control-trace">
                  <div class="control-trace-label">Model input after APIM · ${message.safety.redactionCount} fields redacted</div>
                  <div class="control-trace-text">${escapeHtml(message.safety.redactedInput)}</div>
                </div>
              ` : ""}
            </div>
          </div>
        `).join("")}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }

      async function sendMessage(text) {
        const content = text.trim();
        if (!content || busy) return;
        messages.push({ role: "user", content });
        busy = true;
        send.disabled = true;
        prompt.value = "";
        renderChat();

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: messages.filter((message) => !message.error).map(({ role, content }) => ({ role, content }))
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "The advisor is unavailable.");
          messages.push({ role: "assistant", content: result.message, safety: result.safety });
        } catch (error) {
          messages.push({ role: "assistant", content: error.message, error: true });
        } finally {
          busy = false;
          send.disabled = false;
          renderChat();
          prompt.focus();
        }
      }

      chat.addEventListener("click", (event) => {
        const button = event.target.closest("[data-prompt]");
        if (button) sendMessage(button.dataset.prompt);
      });

      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(prompt.value);
      });

      prompt.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });

      fetch("/api/health")
        .then((response) => response.json())
        .then((health) => {
          serviceStatus.classList.toggle("connected", health.apimConfigured);
          serviceStatus.querySelector("span:last-child").textContent =
            health.apimConfigured && health.backendConfigured
              ? "APIM and agent connected"
              : health.apimConfigured
                ? "APIM connected · agent pending"
                : "APIM setup required";
        })
        .catch(() => {
          serviceStatus.querySelector("span:last-child").textContent = "Local service unavailable";
        });

      renderChat();
    </script>
  </body>
</html>
